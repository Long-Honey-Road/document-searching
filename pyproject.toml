[project]
name = "regagent"
version = "0.1.0"
description = "Агент поиска и ответов по корпоративным регламентам"
readme = "README.md"
requires-python = ">=3.12,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/common", "services/knowledge", "services/backend"]

[tool.uv.sources]
regagent-common = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# uv.lock фиксирует разрешённые версии. Новые зависимости добавлять через `uv add`.
[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "mypy",
  "testcontainers",
  "python-docx>=1.2.0",
  "pyyaml>=6.0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "services", "deploy/tests", "scripts/synth/tests", "scripts/eval/tests", "tests/e2e", "tests/docs"]
markers = [
  "integration: нужны контейнеры (Postgres, RabbitMQ)",
  "e2e: весь стенд в compose",
  "llm: настоящая модель, в CI по умолчанию не запускается",
  "leak: тесты на утечки между уровнями доступа",
]
pythonpath = ["."]
addopts = "-m 'not integration and not e2e and not llm' --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
explicit_package_bases = true
# Корни пакетов: иначе с explicit_package_bases модуль common находится дважды
# (по пути в репо и как установленный пакет с py.typed)
mypy_path = ["packages/common/src", "services/knowledge/src", "services/backend/src"]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
