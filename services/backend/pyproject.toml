[project]
name = "regagent-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["regagent-common", "aegra-api", "deepagents", "langgraph", "langchain-openai", "fastapi", "httpx", "pyjwt[crypto]", "aio-pika", "asyncpg", "aiosmtplib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regagent_backend"]
