# Синтетические записи для демо. Публикуются через обычный контур заявок ОКК.
practices:
  - key: travel-weekend-taxi
    question: Оплатят ли такси в командировке в субботу или в региональный праздник?
    comment: Демонстрационная практика по нерабочим дням, не является юридической консультацией.
    draft:
      mode: clarifies
      binds:
        - doc_id: business-travel-expenses
          version: 1
          clause: "2.2"
      text: >-
        Практика ОКК к п. 2.2 Регламента командировочных расходов.
        Такси в субботу, воскресенье или официальный нерабочий праздник,
        включая региональный праздник по месту командировки, не возмещается
        автоматически по общему порядку даже при служебном маршруте и чеке.
        Для возмещения такой поездки сотрудник до её совершения согласует
        с руководителем служебную работу в нерабочий день и сам маршрут.
        Без такого согласования финансовый специалист не включает расход
        в возмещение; спорный случай передаётся в ОКК.
  - key: dib-incomplete-project-card
    question: Когда начинается срок назначения РП в ДИБ, если карточка проекта неполная?
    comment: Демонстрационное уточнение порядка для неполной карточки проекта.
    draft:
      mode: clarifies
      binds:
        - doc_id: dib-project-activity
          version: 1
          clause: "2.2"
        - doc_id: dib-project-activity
          version: 1
          clause: "2.7"
      text: >-
        Практика ОКК к п. 2.2 и 2.7 регламента проектной деятельности ДИБ.
        Если в карточке проекта нет обязательных сведений, включая итоговый
        расчёт, координатор перечисляет недостающие данные в карточке и
        запрашивает их у SS. Однодневный срок назначения РП применяется после
        получения полного комплекта сведений; до этого карточка остаётся
        на уточнении, а назначение РП не подтверждается.
