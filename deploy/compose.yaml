# Запуск: docker compose -f deploy/compose.yaml --env-file .env up -d
# Профили: dev (Mailpit), local-embeddings (TEI), local-reranker (только реранкер).
name: regagent

x-model-env: &model-env
  ENV: ${ENV}
  LOG_LEVEL: ${LOG_LEVEL}
  LLM_BASE_URL: ${LLM_BASE_URL}
  LLM_API_KEY: ${LLM_API_KEY}
  LLM_MODEL: ${LLM_MODEL}
  LLM_AGENT_MODEL: ${LLM_AGENT_MODEL}
  LLM_GUARD_MODEL: ${LLM_GUARD_MODEL}
  LLM_EXTRACT_MODEL: ${LLM_EXTRACT_MODEL}
  LLM_KEYWORD_MODEL: ${LLM_KEYWORD_MODEL}
  LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL}
  LLM_TIMEOUT_S: ${LLM_TIMEOUT_S}
  LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY}
  LLM_EXTRA_BODY_JSON: ${LLM_EXTRA_BODY_JSON}
  EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL}
  EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL}
  EMBEDDINGS_DIM: ${EMBEDDINGS_DIM}
  RERANK_BASE_URL: ${RERANK_BASE_URL}
  RERANK_MODEL: ${RERANK_MODEL}
  RERANK_MIN_SCORE: ${RERANK_MIN_SCORE}
  KNOWLEDGE_INTERNAL_TOKEN: ${KNOWLEDGE_INTERNAL_TOKEN}
  ACCESS_LEVELS_FILE: /app/config/access_levels.yaml

services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_DB: ${APP_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      KNOWLEDGE_DB: ${KNOWLEDGE_DB}
      KNOWLEDGE_DB_USER: ${KNOWLEDGE_DB_USER}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${PUBLIC_BASE_URL}/auth
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      WEB_DEV_BASE_URL: ${WEB_DEV_BASE_URL:-http://localhost:5173}
      KEYCLOAK_EMPLOYEE_PUBLIC_PASSWORD: ${KEYCLOAK_EMPLOYEE_PUBLIC_PASSWORD}
      KEYCLOAK_EMPLOYEE_FIN_PASSWORD: ${KEYCLOAK_EMPLOYEE_FIN_PASSWORD}
      KEYCLOAK_QC_EXPERT_PASSWORD: ${KEYCLOAK_QC_EXPERT_PASSWORD}
      KEYCLOAK_ADMIN_DEMO_PASSWORD: ${KEYCLOAK_ADMIN_DEMO_PASSWORD}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  knowledge:
    build:
      context: ..
      dockerfile: services/knowledge/Dockerfile
    environment:
      <<: *model-env
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      KNOWLEDGE_DB: ${KNOWLEDGE_DB}
      KNOWLEDGE_DB_USER: ${KNOWLEDGE_DB_USER}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD}
      RABBITMQ_URL: ${RABBITMQ_URL}
      DOCS_DIR: ${DOCS_DIR}
      OKF_DIR: ${OKF_DIR}
      WATCH_DEBOUNCE_S: ${WATCH_DEBOUNCE_S}
      INDEX_MAX_RETRIES: ${INDEX_MAX_RETRIES}
      # Тайм-аут одной попытки индексации, с (D-44)
      INDEX_JOB_TIMEOUT_S: ${INDEX_JOB_TIMEOUT_S:-1800}
      CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS}
      SEARCH_TOP_K: ${SEARCH_TOP_K}
      RERANK_MODE: ${RERANK_MODE:-embeddings}
      RERANK_CANDIDATE_LIMIT: ${RERANK_CANDIDATE_LIMIT:-24}
      RERANK_TEXT_MAX_CHARS: ${RERANK_TEXT_MAX_CHARS:-384}
      SEARCH_MODE: ${SEARCH_MODE}
      # Рабочий каталог LightRAG — на томе (D-33); повторы извлечения сущностей
      LIGHTRAG_WORKING_DIR: ${LIGHTRAG_WORKING_DIR:-/data/lightrag}
      LIGHTRAG_EXTRACT_GLEANING: ${LIGHTRAG_EXTRACT_GLEANING:-1}
      # Язык извлечения сущностей (D-45); JSON-извлечение — только если модель умеет json_object (D-46)
      LIGHTRAG_LANGUAGE: ${LIGHTRAG_LANGUAGE:-Russian}
      LIGHTRAG_EXTRACTION_JSON: ${LIGHTRAG_EXTRACTION_JSON:-false}
    # Ollama и модель на хосте: на Linux host.docker.internal сам не резолвится
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: volume
        source: lightrag
        target: /data/lightrag
      - type: bind
        source: ../data/docs
        target: ${DOCS_DIR}
        read_only: true
      - type: bind
        source: ../data/okf
        target: ${OKF_DIR}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ..
      dockerfile: services/backend/Dockerfile
    environment:
      <<: *model-env
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${APP_DB}
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      AEGRA_CONFIG: /app/services/backend/aegra.json
      AUTH_TYPE: custom
      ENV_MODE: ${ENV:-dev}
      SERVER_URL: ${PUBLIC_BASE_URL}/api
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/auth/realms/regagent/protocol/openid-connect/certs}
      KNOWLEDGE_URL: ${KNOWLEDGE_URL}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS}
      GUARD_MODE: ${GUARD_MODE:-json_schema}
      MEMORY_AREA_TTL_DAYS: ${MEMORY_AREA_TTL_DAYS}
      MEMORY_MAX_ACTIVE_AREAS: ${MEMORY_MAX_ACTIVE_AREAS}
      QUESTION_MAX_CHARS: ${QUESTION_MAX_CHARS}
      RATE_LIMIT_PER_USER_PER_MIN: ${RATE_LIMIT_PER_USER_PER_MIN}
      RABBITMQ_URL: ${RABBITMQ_URL}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      # Параметры агента 2 (D-20, D-24) и кэш ключей Keycloak — со значениями по умолчанию
      AREA_CODES: ${AREA_CODES:-ДИБ,ДБРЦТ,общий}
      KNOWLEDGE_TIMEOUT_S: ${KNOWLEDGE_TIMEOUT_S:-30}
      AGENT_MAX_SEARCHES: ${AGENT_MAX_SEARCHES:-3}
      TOOL_RESULT_MAX_CHARS: ${TOOL_RESULT_MAX_CHARS:-12000}
      JWKS_CACHE_TTL_S: ${JWKS_CACHE_TTL_S:-300}
      JWKS_MIN_REFRESH_S: ${JWKS_MIN_REFRESH_S:-30}
      JWT_LEEWAY_S: ${JWT_LEEWAY_S:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  web:
    build:
      context: ../web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID}
        VITE_ASSISTANT_ID: ${VITE_ASSISTANT_ID:-}

  proxy:
    image: caddy:latest
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro

  embeddings:
    profiles: ["local-embeddings"]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.10}
    command: ["--model-id", "${EMBEDDINGS_MODEL}"]

  reranker:
    profiles: ["local-embeddings", "local-reranker"]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.10}
    command: ["--model-id", "${RERANK_MODEL}"]

  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  lightrag:
